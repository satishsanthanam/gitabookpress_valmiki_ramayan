<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valmiki Ramayana Reader</title>
  <style>
    :root {
      --bg-color: #fdfbf7;
      --card-bg: #ffffff;
      --accent-color: #8b0000;
      --sarga-header-bg: #f7f1e5;
      --kanda-header-bg: #8b0000;
      --text-color: #2c2c2c;
      --border-color: #e2d8c3;
      --highlight-bg: #ffe0b2;
      --trans-color: #4a5568;
    }

    body {
      font-family: 'Segoe UI', Georgia, serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      color: var(--accent-color);
      margin-bottom: 20px;
    }

    /* Search Bar */
    .search-box {
      margin-bottom: 20px;
    }

    .search-input {
      width: 100%;
      padding: 12px 16px;
      font-size: 1rem;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      outline: none;
      background-color: #fff;
      box-sizing: border-box;
    }

    .search-input:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 2px rgba(139, 0, 0, 0.1);
    }

    .search-stats {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 15px;
    }

    /* Tier 1: Kanda Accordion */
    .kanda-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      margin-bottom: 20px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }

    .kanda-header {
      background-color: var(--kanda-header-bg);
      color: #ffffff;
      padding: 16px 20px;
      cursor: pointer;
      font-weight: bold;
      font-size: 1.2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .kanda-header:hover {
      background-color: #6d0000;
    }

    .kanda-content {
      display: none;
      padding: 15px;
      background-color: #faf6f0;
    }

    /* Tier 2: Sarga Accordion */
    .sarga-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      margin-bottom: 12px;
      overflow: hidden;
    }

    .sarga-card:last-child {
      margin-bottom: 0;
    }

    .sarga-header {
      background-color: var(--sarga-header-bg);
      padding: 12px 18px;
      cursor: pointer;
      font-weight: bold;
      font-size: 1.05rem;
      color: var(--accent-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .sarga-header:hover {
      background-color: #efe5d5;
    }

    .sarga-content {
      display: none;
      padding: 20px;
      border-top: 1px solid var(--border-color);
      background-color: #ffffff;
    }

    /* Shloka Card */
    .shloka-card {
      margin-bottom: 25px;
      padding-bottom: 20px;
      border-bottom: 1px dashed var(--border-color);
    }

    .shloka-card:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .shloka-header {
      font-size: 0.85rem;
      font-weight: bold;
      color: #888;
      margin-bottom: 8px;
    }

    .shloka-text {
      font-size: 1.25rem;
      line-height: 1.8;
      color: #000;
      margin-bottom: 6px;
      font-family: 'Noto Sans Devanagari', 'Sanskrit Text', serif;
    }

    .transliteration {
      font-size: 0.98rem;
      font-style: italic;
      color: var(--trans-color);
      margin-bottom: 12px;
      line-height: 1.5;
    }

    .details-block {
      background-color: #faf7f2;
      border-left: 3px solid var(--accent-color);
      padding: 12px 15px;
      border-radius: 0 4px 4px 0;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .detail-section {
      margin-bottom: 10px;
    }

    .detail-section:last-child {
      margin-bottom: 0;
    }

    .detail-label {
      font-weight: bold;
      color: var(--accent-color);
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: block;
      margin-bottom: 2px;
    }

    mark {
      background-color: var(--highlight-bg);
      color: inherit;
      padding: 1px 3px;
      border-radius: 3px;
    }

    .arrow {
      transition: transform 0.3s ease;
      display: inline-block;
    }

    .active > .arrow {
      transform: rotate(180deg);
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Valmiki Ramayana</h1>

  <!-- Search Input Bar -->
  <div class="search-box">
    <input 
      type="text" 
      id="search-input" 
      class="search-input" 
      placeholder="Search Devanagari, Transliteration, English meanings, or comments..."
    />
  </div>

  <div id="search-stats" class="search-stats"></div>
  <div id="ramayana-container">Loading Verses...</div>
</div>

<script>
  let kandaMap = {};

  async function loadRamayana() {
    try {
      const response = await fetch('ramayana_data.json');
      const allData = await response.json();

      // Nested Grouping: Kanda -> Sarga -> Shlokas
      kandaMap = {};
      allData.forEach(item => {
        const kName = item.kanda || 'Other Kanda';
        const sNum = item.sarga || 1;

        if (!kandaMap[kName]) kandaMap[kName] = {};
        if (!kandaMap[kName][sNum]) kandaMap[kName][sNum] = [];

        kandaMap[kName][sNum].push(item);
      });

      renderUI('');
    } catch (error) {
      console.error('Error loading JSON dataset:', error);
      document.getElementById('ramayana-container').innerText = 'Failed to load dataset. Please verify ramayana_data.json is in the same directory.';
    }
  }

  function highlightText(text, query) {
    if (!text || !query) return text || '';
    const regex = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
    return text.replace(regex, '<mark>$1</mark>');
  }

  function renderUI(query) {
    const container = document.getElementById('ramayana-container');
    const stats = document.getElementById('search-stats');
    container.innerHTML = '';

    const cleanQuery = query.trim().toLowerCase();
    let totalMatches = 0;
    let matchingKandas = 0;

    Object.keys(kandaMap).forEach(kandaName => {
      const sargas = kandaMap[kandaName];
      let kandaMatchCount = 0;

      // Kanda Level Container
      const kandaCard = document.createElement('div');
      kandaCard.className = 'kanda-card';

      const kandaHeader = document.createElement('div');
      kandaHeader.className = 'kanda-header';

      const kandaContent = document.createElement('div');
      kandaContent.className = 'kanda-content';

      // Build Sargas inside this Kanda
      Object.keys(sargas).sort((a, b) => a - b).forEach(sargaNum => {
        const shlokas = sargas[sargaNum];

        // Filter shlokas by query
        const filteredShlokas = shlokas.filter(item => {
          if (!cleanQuery) return true;
          return (item.shloka_text && item.shloka_text.toLowerCase().includes(cleanQuery)) ||
                 (item.transliteration && item.transliteration.toLowerCase().includes(cleanQuery)) ||
                 (item.translation && item.translation.toLowerCase().includes(cleanQuery)) ||
                 (item.explanation && item.explanation.toLowerCase().includes(cleanQuery)) ||
                 (item.comments && item.comments.toLowerCase().includes(cleanQuery));
        });

        if (filteredShlokas.length === 0) return;

        kandaMatchCount += filteredShlokas.length;

        // Tier 2: Sarga Card
        const sargaCard = document.createElement('div');
        sargaCard.className = 'sarga-card';

        const sargaHeader = document.createElement('div');
        sargaHeader.className = 'sarga-header';
        sargaHeader.innerHTML = `<span>Sarga ${sargaNum} (${filteredShlokas.length} ${cleanQuery ? 'matches' : 'shlokas'})</span> <span class="arrow">▼</span>`;

        const sargaContent = document.createElement('div');
        sargaContent.className = 'sarga-content';

        // Auto-expand Sarga if searching
        if (cleanQuery) {
          sargaContent.style.display = 'block';
          sargaHeader.classList.add('active');
        }

        filteredShlokas.forEach(item => {
          const shlokaDiv = document.createElement('div');
          shlokaDiv.className = 'shloka-card';

          let detailsHTML = '';
          if (item.translation) {
            detailsHTML += `<div class="detail-section"><span class="detail-label">Word-by-Word Translation</span>${highlightText(item.translation, cleanQuery)}</div>`;
          }
          if (item.explanation) {
            detailsHTML += `<div class="detail-section"><span class="detail-label">Explanation</span>${highlightText(item.explanation, cleanQuery)}</div>`;
          }
          if (item.comments) {
            detailsHTML += `<div class="detail-section"><span class="detail-label">Commentary</span>${highlightText(item.comments, cleanQuery)}</div>`;
          }

          shlokaDiv.innerHTML = `
            <div class="shloka-header">Shloka ${item.shloka}</div>
            <div class="shloka-text">${highlightText(item.shloka_text, cleanQuery)}</div>
            ${item.transliteration ? `<div class="transliteration">${highlightText(item.transliteration, cleanQuery)}</div>` : ''}
            ${detailsHTML ? `<div class="details-block">${detailsHTML}</div>` : ''}
          `;
          sargaContent.appendChild(shlokaDiv);
        });

        sargaHeader.addEventListener('click', (e) => {
          e.stopPropagation();
          const isOpen = sargaContent.style.display === 'block';
          sargaContent.style.display = isOpen ? 'none' : 'block';
          sargaHeader.classList.toggle('active', !isOpen);
        });

        sargaCard.appendChild(sargaHeader);
        sargaCard.appendChild(sargaContent);
        kandaContent.appendChild(sargaCard);
      });

      if (kandaMatchCount === 0) return;

      matchingKandas++;
      totalMatches += kandaMatchCount;

      kandaHeader.innerHTML = `<span>${kandaName} (${kandaMatchCount} ${cleanQuery ? 'matches' : 'shlokas'})</span> <span class="arrow">▼</span>`;

      // Auto-expand Kanda if searching
      if (cleanQuery) {
        kandaContent.style.display = 'block';
        kandaHeader.classList.add('active');
      }

      kandaHeader.addEventListener('click', () => {
        const isOpen = kandaContent.style.display === 'block';
        kandaContent.style.display = isOpen ? 'none' : 'block';
        kandaHeader.classList.toggle('active', !isOpen);
      });

      kandaCard.appendChild(kandaHeader);
      kandaCard.appendChild(kandaContent);
      container.appendChild(kandaCard);
    });

    if (cleanQuery) {
      stats.innerText = `Found ${totalMatches} matching shloka(s) across ${matchingKandas} Kanda(s).`;
    } else {
      stats.innerText = '';
    }
  }

  // Debounced search input
  let timeout = null;
  document.getElementById('search-input').addEventListener('input', (e) => {
    clearTimeout(timeout);
    timeout = setTimeout(() => {
      renderUI(e.target.value);
    }, 200);
  });

  loadRamayana();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="doc-title">Valmiki Ramayana Reader</title>
  <style>
    :root {
      --bg-color: #fdfbf7;
      --card-bg: #ffffff;
      --accent-color: #8b0000;
      --sarga-header-bg: #f7f1e5;
      --text-color: #2c2c2c;
      --border-color: #e2d8c3;
      --highlight-bg: #ffe0b2;
      --shloka-color: #1a1a1a;
      --trans-color: #2b6cb0;
      --exp-bg: #f0fff4;
      --exp-border: #38a169;
      --exp-text: #22543d;
      --comm-bg: #faf5ff;
      --comm-border: #805ad5;
      --comm-text: #553c9a;
    }

    body { font-family: 'Georgia', 'Segoe UI', serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { text-align: center; color: var(--accent-color); margin-bottom: 20px; text-transform: capitalize; }
    
    .kanda-nav { text-align: center; margin-bottom: 20px; font-size: 0.95rem; }
    .kanda-nav a { color: var(--accent-color); text-decoration: none; margin: 0 8px; font-weight: bold; }
    .kanda-nav a.active { text-decoration: underline; background-color: #ffe0b2; padding: 2px 6px; border-radius: 4px; }

    .search-box { margin-bottom: 20px; }
    .search-input { width: 100%; padding: 12px 16px; font-size: 1rem; border: 1px solid var(--border-color); border-radius: 6px; outline: none; background-color: #fff; box-sizing: border-box; }

    .sarga-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 6px; margin-bottom: 15px; overflow: hidden; }
    .sarga-header { background-color: var(--sarga-header-bg); padding: 12px 18px; cursor: pointer; font-weight: bold; font-size: 1.05rem; color: var(--accent-color); display: flex; justify-content: space-between; align-items: center; }
    .sarga-header-left { display: flex; align-items: center; gap: 12px; }
    .sarga-audio-btn { background-color: var(--accent-color); color: #fff; border: none; border-radius: 4px; padding: 4px 10px; font-size: 0.78rem; font-weight: 600; cursor: pointer; }
    .sarga-content { display: none; padding: 20px; border-top: 1px solid var(--border-color); background-color: #ffffff; }

    .shloka-card { margin-bottom: 25px; padding-bottom: 20px; border-bottom: 1px dashed var(--border-color); }
    .shloka-card:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .shloka-header { font-size: 0.85rem; font-weight: bold; color: #777; margin-bottom: 10px; text-transform: uppercase; display: flex; align-items: center; justify-content: space-between; }
    .shloka-audio-btn { background: transparent; border: 1px solid var(--accent-color); color: var(--accent-color); border-radius: 4px; padding: 2px 8px; font-size: 0.75rem; font-weight: 600; cursor: pointer; }
    .shloka-audio-btn:hover { background-color: var(--accent-color); color: #ffffff; }

    .sec-shloka { font-size: 1.35rem; line-height: 1.8; color: var(--shloka-color); font-weight: 600; margin-bottom: 12px; white-space: pre-line; font-family: 'Noto Sans Devanagari', 'Sanskrit Text', Georgia, serif; }
    .content-box { padding: 12px 16px; border-radius: 0 6px 6px 0; margin-bottom: 10px; font-size: 0.95rem; line-height: 1.6; }
    .content-title { font-weight: bold; font-size: 0.8rem; text-transform: uppercase; display: block; margin-bottom: 4px; }
    
    .sec-summary { background-color: #fff9e6; border-left: 4px solid var(--accent-color); color: #5a3e00; font-style: italic; }
    .sec-meaning { background-color: var(--exp-bg); border-left: 4px solid var(--exp-border); color: var(--exp-text); }
    .sec-commentary { background-color: var(--comm-bg); border-left: 4px solid var(--comm-border); color: var(--comm-text); }
    mark { background-color: var(--highlight-bg); padding: 1px 3px; border-radius: 3px; }
  </style>
</head>
<body>

<div class="container">
  <h1 id="page-title">Valmiki Ramayana</h1>

  <!-- DYNAMIC KANDA NAVIGATION -->
  <div class="kanda-nav">
    <a href="ram.html?kanda=balakanda" id="nav-balakanda">Bala</a> •
    <a href="ram.html?kanda=ayodhyakanda" id="nav-ayodhyakanda">Ayodhya</a> •
    <a href="ram.html?kanda=aranyakanda" id="nav-aranyakanda">Aranya</a> •
    <a href="ram.html?kanda=kishkindhakanda" id="nav-kishkindhakanda">Kishkindha</a> •
    <a href="ram.html?kanda=sundarakanda" id="nav-sundarakanda">Sundara</a> •
    <a href="ram.html?kanda=yuddhakanda" id="nav-yuddhakanda">Yuddha</a> •
    <a href="ram.html?kanda=uttarakanda" id="nav-uttarakanda">Uttara</a>
  </div>

  <div class="search-box">
    <input type="text" id="search-input" class="search-input" placeholder="Search Devanagari, English meanings, or comments..." />
  </div>

  <div id="ramayana-container">Loading Verses...</div>
</div>

<script>
  let sargaMap = {};
  let currentAudio = null;

  // 1. Detect current Kanda from URL (e.g. ram.html?kanda=ayodhyakanda)
  const urlParams = new URLSearchParams(window.location.search);
  const currentKandaKey = (urlParams.get('kanda') || 'balakanda').toLowerCase();

  // Mapping keys to JSON filenames and display titles
  const kandaConfig = {
    'balakanda': { json: 'data/Valmiki_Ramayan_Balakanda.json', title: 'Bala Kanda - Valmiki Ramayana' },
    'ayodhyakanda': { json: 'data/Valmiki_Ramayan_Ayodhyakanda.json', title: 'Ayodhya Kanda - Valmiki Ramayana' },
    'aranyakanda': { json: 'data/Valmiki_Ramayan_Aranyakanda.json', title: 'Aranya Kanda - Valmiki Ramayana' },
    'kishkindhakanda': { json: 'data/Valmiki_Ramayan_Kishkindhakanda.json', title: 'Kishkindha Kanda - Valmiki Ramayana' },
    'sundarakanda': { json: 'data/Valmiki_Ramayan_Sundarakanda.json', title: 'Sundara Kanda - Valmiki Ramayana' },
    'yuddhakanda': { json: 'data/Valmiki_Ramayan_Yuddhakanda.json', title: 'Yuddha Kanda - Valmiki Ramayana' },
    'uttarakanda': { json: 'data/Valmiki_Ramayan_Uttarakanda.json', title: 'Uttara Kanda - Valmiki Ramayana' }
  };

  const activeCfg = kandaConfig[currentKandaKey] || kandaConfig['balakanda'];

  // Update Page Headings & Active Navigation Link
  document.getElementById('doc-title').innerText = activeCfg.title;
  document.getElementById('page-title').innerText = activeCfg.title;
  const activeNav = document.getElementById(`nav-${currentKandaKey}`);
  if (activeNav) activeNav.classList.add('active');

  function stopAudio() {
    if (currentAudio) {
      currentAudio.pause();
      currentAudio.currentTime = 0;
      currentAudio = null;
    }
  }

  function getAudioPath(item) {
    if (item.audio_file) return `./audio/${item.audio_file}`;
    return `./audio/ramayana/${currentKandaKey}/${item.sarga}_${item.shloka}.mp3`;
  }

  function playSingleMP3(audioPath) {
    stopAudio();
    currentAudio = new Audio(audioPath);
    currentAudio.play().catch(err => {
      alert(`Audio currently unavailable: ${audioPath}`);
    });
  }

  function playFullSargaMP3(sargaNum) {
    stopAudio();
    const fullSargaPath = `./audio/ramayana/${currentKandaKey}/${sargaNum}.mp3`;
    currentAudio = new Audio(fullSargaPath);
    currentAudio.play().catch(err => {
      alert(`Full Sarga audio currently unavailable: ${fullSargaPath}`);
    });
  }

  async function loadRamayana() {
    try {
      const response = await fetch(activeCfg.json);
      const allData = await response.json();

      sargaMap = {};
      allData.forEach(item => {
        const sNum = item.sarga || 1;
        if (!sargaMap[sNum]) sargaMap[sNum] = [];
        sargaMap[sNum].push(item);
      });

      renderUI('');
    } catch (error) {
      console.error('Error loading JSON:', error);
      document.getElementById('ramayana-container').innerText = `Failed to load ${activeCfg.title} dataset.`;
    }
  }

  function highlightText(text, query) {
    if (!text || !query) return text || '';
    const regex = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
    return text.replace(regex, '<mark>$1</mark>');
  }

  function renderUI(query) {
    const container = document.getElementById('ramayana-container');
    container.innerHTML = '';
    const cleanQuery = query.trim().toLowerCase();

    Object.keys(sargaMap).sort((a, b) => Number(a) - Number(b)).forEach(sargaNum => {
      const shlokas = sargaMap[sargaNum];

      const filteredShlokas = shlokas.filter(item => {
        if (!cleanQuery) return true;
        return (item.shloka_text && item.shloka_text.toLowerCase().includes(cleanQuery)) ||
               (item.explanation && item.explanation.toLowerCase().includes(cleanQuery)) ||
               (item.comments && item.comments.toLowerCase().includes(cleanQuery));
      });

      if (filteredShlokas.length === 0) return;

      const sargaCard = document.createElement('div');
      sargaCard.className = 'sarga-card';

      const sargaHeader = document.createElement('div');
      sargaHeader.className = 'sarga-header';
      sargaHeader.innerHTML = `
        <div class="sarga-header-left">
          <span>Sarga ${sargaNum} (${filteredShlokas.length} items)</span>
          <button class="sarga-audio-btn" onclick="event.stopPropagation(); playFullSargaMP3(${sargaNum})">
            ▶ Listen Full Sarga
          </button>
        </div>
        <span>▼</span>
      `;

      const sargaContent = document.createElement('div');
      sargaContent.className = 'sarga-content';

      if (cleanQuery) sargaContent.style.display = 'block';

      filteredShlokas.forEach(item => {
        const shlokaDiv = document.createElement('div');
        shlokaDiv.className = 'shloka-card';

        const audioPath = getAudioPath(item);
        const isSummary = (item.shloka === 0);

        if (isSummary) {
          shlokaDiv.innerHTML = `
            <div class="shloka-header" style="color: var(--accent-color); font-size: 0.9rem;">
              <span>📌 SARGA SUMMARY</span>
              <button class="shloka-audio-btn" onclick="playSingleMP3('${audioPath}')">🔊 Listen Summary</button>
            </div>
            <div class="content-box sec-summary">
              ${highlightText(item.explanation || item.translation, cleanQuery)}
            </div>
          `;
        } else {
          let html = `
            <div class="shloka-header">
              <span>Shloka ${item.shloka}</span>
              <button class="shloka-audio-btn" onclick="playSingleMP3('${audioPath}')">🔊 Listen</button>
            </div>
          `;

          if (item.shloka_text) html += `<div class="sec-shloka">${highlightText(item.shloka_text, cleanQuery)}</div>`;
          if (item.explanation) html += `<div class="content-box sec-meaning"><span class="content-title">Meaning</span>${highlightText(item.explanation, cleanQuery)}</div>`;
          if (item.comments) html += `<div class="content-box sec-commentary"><span class="content-title">Commentary</span>${highlightText(item.comments, cleanQuery)}</div>`;

          shlokaDiv.innerHTML = html;
        }

        sargaContent.appendChild(shlokaDiv);
      });

      sargaHeader.addEventListener('click', () => {
        const isOpen = sargaContent.style.display === 'block';
        sargaContent.style.display = isOpen ? 'none' : 'block';
      });

      sargaCard.appendChild(sargaHeader);
      sargaCard.appendChild(sargaContent);
      container.appendChild(sargaCard);
    });
  }

  document.getElementById('search-input').addEventListener('input', (e) => {
    renderUI(e.target.value);
  });

  loadRamayana();
</script>
</body>
</html>

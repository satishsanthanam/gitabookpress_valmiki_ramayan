  <style>
    :root {
      --bg-color: #fdfbf7;
      --card-bg: #ffffff;
      --accent-color: #8b0000;
      --border-color: #e2d8c3;
      --text-color: #2c2c2c;

    body { font-family: 'Georgia', serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 30px 20px; }
    .container { max-width: 800px; margin: 0 auto; text-align: center; }
    h1 { color: var(--accent-color); font-size: 2.2rem; margin-bottom: 10px; }
    p.subtitle { font-style: italic; color: #555; margin-bottom: 40px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
    .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 24px 16px; text-decoration: none; color: var(--accent-color); font-weight: bold; font-size: 1.2rem; transition: all 0.2s ease; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .card:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(139,0,0,0.15); background-color: #fffaf0; }
    .sanskrit-title { display: block; font-size: 0.9rem; font-weight: normal; color: #666; margin-top: 6px; }
  </style>
</head>
